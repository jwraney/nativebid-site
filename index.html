}

  --bg: #171519; --surface: #211f24; --ink: #ecebe6; --muted: #a39e94; --line: #322f36; --line-strong: #46424c;
  --accent: #e0893c; --accent-ink: #1a1207; --accent-soft: #3a2a1a;
  --good: #6fc48e; --good-soft: #1f3327; --warn: #d9a83f; --warn-soft: #3a3020; --bad: #ef7f70; --bad-soft: #3d221f;
  --chip: #2c2930; --chip-on: #ecebe6; --chip-on-ink: #171519; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
} }
:root[data-theme="dark"] {
  --bg: #171519; --surface: #211f24; --ink: #ecebe6; --muted: #a39e94; --line: #322f36; --line-strong: #46424c;
  --accent: #e0893c; --accent-ink: #1a1207; --accent-soft: #3a2a1a;
  --good: #6fc48e; --good-soft: #1f3327; --warn: #d9a83f; --warn-soft: #3a3020; --bad: #ef7f70; --bad-soft: #3d221f;
  --chip: #2c2930; --chip-on: #ecebe6; --chip-on-ink: #171519; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; padding-block: 0 40px; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
.num { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-variant-numeric: tabular-nums; }

header.top { padding: 18px 16px 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
header.top h1 { font: 700 26px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .01em; margin: 0; text-transform: uppercase; }
header.top .meta { color: var(--muted); }
header.top .meta b { color: var(--ink); font-weight: 600; }

.bar-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { border-bottom: 1px solid var(--line); padding: 10px 16px 12px; display: grid; gap: 10px; background: var(--bg); }
.filters-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; white-space: nowrap; }
.filters-btn .badge { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; text-align: center; line-height: 18px; }
.filters-btn .badge:empty { display: none; }
.filters-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.active-summary { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.active-summary:empty { display: none; }
.active-summary .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--chip-on); color: var(--chip-on-ink); cursor: pointer; border: 0; font: inherit; font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.search { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.search:focus, select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select, .row input[type=number] { padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.row input[type=number] { width: 84px; }
.row input[type=range] { width: 140px; accent-color: var(--accent); }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip.overflow { display: none; }
.chips.expanded .chip.overflow { display: inline-block; }
.chip { border: 0; border-radius: 999px; padding: 5px 11px; background: var(--chip); cursor: pointer; line-height: 1.2; }
.chip.more { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); }
.chip small { color: var(--muted); margin-left: 4px; }
.chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
.chip.on small { color: inherit; opacity: .7; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); }
.toggle input { accent-color: var(--accent); margin: 0; }
.toggle.on { border-color: var(--accent); background: var(--accent-soft); }
.count { margin-left: auto; color: var(--muted); }
.count b { color: var(--ink); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0 4px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }
details.more .row { margin-top: 8px; }

main { padding: 14px 16px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); position: relative; }
.card.deal { border-color: var(--accent); }
.card .img { display: block; aspect-ratio: 1; max-width: 100%; background: var(--chip); }
.card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .title { font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-decoration: none; }
.card .title:hover { text-decoration: underline; }
.card .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.price { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.price .allin { font-size: 28px; font-weight: 700; line-height: 1; }
.price .msrp { color: var(--muted); text-decoration: line-through; font-size: 13px; }
.off { margin-left: auto; font-size: 15px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--good-soft); color: var(--good); }
.off.mid { background: var(--warn-soft); color: var(--warn); }
.off.low { background: var(--chip); color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
.facts b { color: var(--ink); font-weight: 600; }
.cond { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--chip); }
.cond.ok { background: var(--good-soft); color: var(--good); }
.cond.bad { background: var(--bad-soft); color: var(--bad); }
.verdict { font-size: 12px; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
.verdict .v { display: inline-block; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; padding: 1px 7px; border-radius: 4px; margin-right: 6px; background: var(--chip); }
.v.great { background: var(--good); color: #fff; } .v.good { background: var(--good-soft); color: var(--good); }
.v.fair { background: var(--warn-soft); color: var(--warn); } .v.skip { background: var(--bad-soft); color: var(--bad); }
.rank { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 6px; }
.more-btn { display: block; margin: 20px auto 0; padding: 10px 22px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .price .allin { font-size: 24px; }
  .row input[type=range] { width: 100px; }
  header.top { padding: 12px 16px 6px; } header.top h1 { font-size: 22px; }
  .search { flex-basis: 100%; }
  .bar-top .count { margin-left: 0; }

@media (prefers-reduced-motion: no-preference) { .chip, .toggle { transition: background .12s, color .12s; } }
</style>

<header class="top">
  <h1>NativeBid Lot Finder</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="bar-top">
  <input class="search" id="q" type="search" placeholder="Search titles (e.g. dining table, Safavieh, leather)" autocomplete="off">
  <button class="filters-btn" id="filtersBtn" type="button" aria-expanded="false" aria-controls="panel">Filters <span class="badge" id="filtersBadge"></span></button>
  <span class="count" id="count"></span>
  <div class="active-summary" id="activeSummary"></div>
</div>
<div class="panel" id="panel" hidden>
  <div class="row">
    <label class="toggle" id="dealsWrap"><input type="checkbox" id="deals"> Top deals only</label>
    <label for="sort">Sort</label>
    <select id="sort">
      <option value="score">Deal score</option>
      <option value="off">% off MSRP</option>
      <option value="allin">All-in, low to high</option>
      <option value="msrp">MSRP, high to low</option>
      <option value="savings">Savings, high to low</option>
      <option value="closes">Closing soonest</option>
      <option value="bids">Fewest bids</option>
      <option value="lot">Lot number</option>
    </select>
  </div>
  <div class="row"><label>Type</label><div class="chips" id="types"></div></div>
  <div class="row"><label>Room</label><div class="chips" id="rooms"></div></div>
  <details class="more" id="moreWrap">
    <summary>More filters</summary>
    <div class="row">
      <label for="minoff">Min % off</label><input type="range" id="minoff" min="0" max="99" step="1" value="0"><span class="num" id="minoffv">0%</span>
      <label for="maxallin">Max all-in $</label><input type="number" id="maxallin" min="0" step="5" placeholder="any">
      <label for="minmsrp">Min MSRP $</label><input type="number" id="minmsrp" min="0" step="10" placeholder="any">
      <label for="maxbids">Max bids</label><input type="number" id="maxbids" min="0" step="1" placeholder="any">
      <label for="cond">Condition</label>
      <select id="cond"><option value="">any</option><option value="ok">undamaged only</option><option value="known">has condition info</option></select>
      <button class="linkbtn" id="reset" type="button">Reset filters</button>
    </div>
  </details>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No lots match these filters.</div>
  <button class="more-btn" id="more" type="button" hidden>Show more</button>
</main>

", "retail_url": "", "available_elsewhere": null, "verdict": "", "verify_notes": "", "url": "https://www.nativebid.com/Event/LotDetails/267515654/DSMGarvee-Over-The-Toilet-Storage-Shelf-3-Tier-Carbon-Steel-Bathroom-Organizer-Space-Saving-Restroom-MSRP-239", "image": "https://nativebid1.blob.core.windows.net/assets/media/eb88a84d-1e79-4aa9-a175-daf7853f3d35_thumbfit.jpg", "event_id": "266578265", "lot_id": "267515654"}];
</script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const PAGE = 72;
  const state = { q: "", deals: false, sort: "score", types: new Set(), rooms: new Set(), minoff: 0, maxallin: "", minmsrp: "", maxbids: "", cond: "", shown: PAGE };

  const fmt = n => (n == null || isNaN(n)) ? "—" : "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtS = n => (n == null || isNaN(n)) ? "—" : "$" + Math.round(Number(n)).toLocaleString("en-US");
  function closesText(s) {
    if (!s) return "";
    const m = /(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)/.exec(s);
    if (!m) return s;
    const d = new Date(+m[3], +m[1] - 1, +m[2], +m[4], +m[5]);
    const day = d.toLocaleDateString("en-US", { weekday: "short" });
    let h = d.getHours(), ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    return `${day} ${h}:${String(d.getMinutes()).padStart(2, "0")} ${ap}`;
  }
  function closesKey(s) { const m = /(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)/.exec(s || ""); return m ? new Date(+m[3], +m[1] - 1, +m[2], +m[4], +m[5], +m[6]).getTime() : 9e15; }
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const condOk = c => /undamaged|new|sealed/i.test(c || "") && !/damaged|missing|broken/i.test((c || "").replace(/undamaged/i, ""));

  // persistence (per-browser convenience only)
  try { const s = JSON.parse(localStorage.getItem("nb-filters") || "null"); if (s) { Object.assign(state, s, { types: new Set(s.types || []), rooms: new Set(s.rooms || []), shown: PAGE }); } } catch (e) {}
  function save() { try { localStorage.setItem("nb-filters", JSON.stringify({ ...state, types: [...state.types], rooms: [...state.rooms] })); } catch (e) {} }

  // header
  $("meta").innerHTML = `<b>${esc(META.event)}</b> · closes ${esc(closesText(META.closes) || META.closes)} · pulled ${esc(META.generated)} · <b>${LOTS.length.toLocaleString()}</b> lots with an MSRP · all-in = next bid + ${META.premium}% premium + $${META.fee} fee`;

  // chip groups (types show the 12 most common, the rest behind "+N more")
  function buildChips(id, key, selected, limit) {
    const counts = {};
    LOTS.forEach(l => (Array.isArray(l[key]) ? l[key] : [l[key]]).forEach(v => { if (v) counts[v] = (counts[v] || 0) + 1; }));
    const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const box = $(id); box.innerHTML = ""; box.classList.remove("expanded");
    let hidden = 0;
    names.forEach((n, i) => {
      const b = document.createElement("button"); b.type = "button";
      const overflow = limit && i >= limit && !selected.has(n);
      if (overflow) hidden++;
      b.className = "chip" + (selected.has(n) ? " on" : "") + (overflow ? " overflow" : "");
      b.innerHTML = `${esc(n)}<small>${counts[n]}</small>`; b.dataset.v = n;
      b.addEventListener("click", () => { selected.has(n) ? selected.delete(n) : selected.add(n); b.classList.toggle("on"); state.shown = PAGE; render(); });
      box.appendChild(b);
    });
    if (hidden) {
      const m = document.createElement("button"); m.type = "button"; m.className = "chip more"; m.textContent = `+${hidden} more`;
      m.addEventListener("click", () => { const open = box.classList.toggle("expanded"); m.textContent = open ? "show fewer" : `+${hidden} more`; });
      box.appendChild(m);
    }
  }
  function buildAllChips() { buildChips("types", "type", state.types, 12); buildChips("rooms", "rooms", state.rooms, 0); }
  buildAllChips();

  // filters panel: open on wide screens, closed on phones
  const panel = $("panel"), fbtn = $("filtersBtn");
  function setPanel(open) { panel.hidden = !open; fbtn.setAttribute("aria-expanded", String(open)); }
  setPanel(window.innerWidth >= 900);
  fbtn.addEventListener("click", () => setPanel(panel.hidden));

  function activeFilters() {
    const a = [];
    if (state.deals) a.push({ label: "top deals", clear: () => { state.deals = false; $("deals").checked = false; } });
    state.types.forEach(t => a.push({ label: t, clear: () => state.types.delete(t) }));
    state.rooms.forEach(r => a.push({ label: r, clear: () => state.rooms.delete(r) }));
    if (state.minoff > 0) a.push({ label: `≥ ${state.minoff}% off`, clear: () => { state.minoff = 0; $("minoff").value = 0; } });
    if (state.maxallin !== "") a.push({ label: `≤ $${state.maxallin} all-in`, clear: () => { state.maxallin = ""; $("maxallin").value = ""; } });
    if (state.minmsrp !== "") a.push({ label: `MSRP ≥ $${state.minmsrp}`, clear: () => { state.minmsrp = ""; $("minmsrp").value = ""; } });
    if (state.maxbids !== "") a.push({ label: `≤ ${state.maxbids} bids`, clear: () => { state.maxbids = ""; $("maxbids").value = ""; } });
    if (state.cond) a.push({ label: state.cond === "ok" ? "undamaged" : "has condition", clear: () => { state.cond = ""; $("cond").value = ""; } });
    return a;
  }
  function renderSummary() {
    const a = activeFilters();
    $("filtersBadge").textContent = a.length ? String(a.length) : "";
    const box = $("activeSummary"); box.innerHTML = "";
    if (!a.length || !panel.hidden) return;
    a.forEach(f => {
      const p = document.createElement("button"); p.type = "button"; p.className = "pill"; p.innerHTML = `${esc(f.label)} <span aria-hidden="true">×</span>`;
      p.title = "Remove this filter";
      p.addEventListener("click", () => { f.clear(); buildAllChips(); state.shown = PAGE; render(); });
      box.appendChild(p);
    });
  }
  fbtn.addEventListener("click", renderSummary);

  // controls
  $("q").value = state.q; $("deals").checked = state.deals; $("sort").value = state.sort;
  $("minoff").value = state.minoff; $("maxallin").value = state.maxallin; $("minmsrp").value = state.minmsrp; $("maxbids").value = state.maxbids; $("cond").value = state.cond;
  if (state.minoff || state.maxallin || state.minmsrp || state.maxbids || state.cond) $("moreWrap").open = true;
  const bind = (id, key, ev = "input", tf = v => v) => $(id).addEventListener(ev, e => { state[key] = tf(e.target.type === "checkbox" ? e.target.checked : e.target.value); state.shown = PAGE; render(); });
  bind("q", "q"); bind("deals", "deals", "change"); bind("sort", "sort", "change");
  bind("minoff", "minoff", "input", Number); bind("maxallin", "maxallin"); bind("minmsrp", "minmsrp"); bind("maxbids", "maxbids"); bind("cond", "cond", "change");
  $("reset").addEventListener("click", () => {
    Object.assign(state, { q: "", deals: false, sort: "score", minoff: 0, maxallin: "", minmsrp: "", maxbids: "", cond: "", shown: PAGE }); state.types.clear(); state.rooms.clear();
    $("q").value = ""; $("deals").checked = false; $("sort").value = "score"; $("minoff").value = 0; $("maxallin").value = ""; $("minmsrp").value = ""; $("maxbids").value = ""; $("cond").value = "";
    buildAllChips(); render();
  });
  $("more").addEventListener("click", () => { state.shown += PAGE; render(true); });

  const sorters = {
    score: (a, b) => b.score - a.score, off: (a, b) => b.discount_pct - a.discount_pct, allin: (a, b) => a.all_in - b.all_in,
    msrp: (a, b) => b.msrp - a.msrp, savings: (a, b) => b.savings - a.savings, closes: (a, b) => closesKey(a.closes) - closesKey(b.closes),
    bids: (a, b) => (a.bids || 0) - (b.bids || 0) || b.score - a.score, lot: (a, b) => (a.lot_number || 0) - (b.lot_number || 0),
  };

  function filtered() {
    const q = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const maxA = state.maxallin === "" ? Infinity : +state.maxallin, minM = state.minmsrp === "" ? 0 : +state.minmsrp, maxB = state.maxbids === "" ? Infinity : +state.maxbids;
    return LOTS.filter(l => {
      if (state.deals && !l.is_deal) return false;
      if (state.types.size && !state.types.has(l.type)) return false;
      if (state.rooms.size && !(l.rooms || []).some(r => state.rooms.has(r))) return false;
      if (l.discount_pct < state.minoff) return false;
      if (l.all_in > maxA || l.msrp < minM || (l.bids || 0) > maxB) return false;
      if (state.cond === "known" && !l.condition) return false;
      if (state.cond === "ok" && !condOk(l.condition)) return false;
      if (q.length) { const t = (l.title + " " + (l.subtitle || "") + " " + l.type + " " + (l.rooms || []).join(" ")).toLowerCase(); if (!q.every(w => t.includes(w))) return false; }
      return true;
    }).sort(sorters[state.sort] || sorters.score);
  }

  function card(l) {
    const off = l.discount_pct >= 75 ? "" : l.discount_pct >= 50 ? " mid" : " low";
    const cond = l.condition ? `<span class="cond${condOk(l.condition) ? " ok" : /damaged|missing|broken/i.test(l.condition) ? " bad" : ""}">${esc(l.condition.split(";")[0])}${l.missing_hardware && /yes/i.test(l.missing_hardware) ? " · missing hardware" : ""}</span>` : "";
    const verdict = l.verdict ? `<div class="verdict"><span class="v ${esc(l.verdict)}">${esc(l.verdict)}</span>${l.retail_price != null ? "retail " + fmt(l.retail_price) : ""}${l.retail_url ? ` <a href="${esc(l.retail_url)}" target="_blank" rel="noopener">${esc(l.retailer || "link")}</a>` : (l.retailer ? " " + esc(l.retailer) : "")}${l.verify_notes ? `<div>${esc(l.verify_notes)}</div>` : ""}</div>` : "";
    return `<article class="card${l.is_deal ? " deal" : ""}">
      ${l.rank ? `<span class="rank">#${l.rank}</span>` : ""}
      <a class="img" href="${esc(l.url)}" target="_blank" rel="noopener">${l.image ? `<img src="${esc(l.image)}" alt="" loading="lazy">` : ""}</a>
      <div class="body">
        <a class="title" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>
        ${l.subtitle ? `<div class="sub">${esc(l.subtitle)}</div>` : ""}
        <div class="tags"><span class="tag">${esc(l.type)}</span>${(l.rooms || []).map(r => `<span class="tag">${esc(r)}</span>`).join("")}</div>
        <div class="price num"><span class="allin">${fmt(l.all_in)}</span><span class="msrp">${fmtS(l.msrp)}</span><span class="off${off}">${Math.round(l.discount_pct)}% off</span></div>
        <div class="facts"><span>Lot <b>${esc(l.lot_number)}</b></span><span><b>${l.bids || 0}</b> bid${l.bids === 1 ? "" : "s"}</span><span>next bid <b>${fmt(l.bid_to_win)}</b></span><span>closes <b>${esc(closesText(l.closes))}</b></span></div>
        ${cond}${verdict}
      </div></article>`;
  }

  function render(append) {
    save();
    const rows = filtered();
    $("count").innerHTML = `<b>${rows.length.toLocaleString()}</b> of ${LOTS.length.toLocaleString()}`;
    $("minoffv").textContent = state.minoff + "%";
    $("dealsWrap").classList.toggle("on", state.deals);
    renderSummary();
    const slice = rows.slice(0, state.shown);
    $("grid").innerHTML = slice.map(card).join("");
    $("empty").hidden = rows.length > 0;
    $("more").hidden = rows.length <= state.shown;
    $("more").textContent = `Show more (${Math.min(PAGE, rows.length - state.shown)} of ${rows.length - state.shown} remaining)`;
  }
  render();
})();
</script>
</body>
